<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GUI Creator - PowerShell GUI designer for GliderUI</title>
  <meta name="description" content="Design cross-platform PowerShell GUIs visually and export scripts for GliderUI (Avalonia UI for PowerShell 7) by mdgrs-mei. Drag-and-drop designer, event handlers, dialogs, wizards, examples and a guided tour.">
  <meta property="og:title" content="GUI Creator - PowerShell GUI designer for GliderUI">
  <meta property="og:description" content="Design PowerShell GUIs in the browser and export scripts for GliderUI by mdgrs-mei.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="menubar">
    <div class="brand"><img class="logo" src="img/gliderui.svg" alt=""> GUI Creator</div>
    <nav id="menus"></nav>
    <div class="spacer"></div>
    <div class="doc-title" id="docTitle"></div>
  </header>

  <div id="toolbar"></div>

  <main id="workspace">
    <aside id="left" class="dock">
      <section class="panel" id="projectPanel">
        <div class="panel-title with-btn">Project<span class="spacer"></span><button class="ptb" data-cmd="addDialog" title="Add a dialog form">+ Dialog</button></div>
        <div id="formsList" class="panel-body"></div>
      </section>
      <section class="panel" id="toolboxPanel">
        <div class="panel-title">Toolbox</div>
        <div class="search"><input id="toolSearch" type="search" placeholder="Search controls"></div>
        <div id="toolbox" class="panel-body"></div>
      </section>
      <section class="panel" id="outlinePanel">
        <div class="panel-title">Document Outline</div>
        <div id="outline" class="panel-body"></div>
      </section>
    </aside>

    <section id="center">
      <div id="docTabs" class="tabs">
        <button data-tab="designer" class="on">Designer</button>
        <button data-tab="script">Script</button>
        <button data-tab="generated">Generated Script</button>
        <button data-tab="xaml">XAML</button>
      </div>
      <div id="designerView" class="view on">
        <div id="dz"><div id="surface"></div></div>
      </div>
      <div id="scriptView" class="view">
        <div class="view-bar">
          <span id="scriptHint"></span>
          <span class="spacer"></span>
          <select id="snippetPick" title="Insert a ready-made code pattern at the cursor"></select>
          <select id="handlerJump" title="Go to event handler"></select>
        </div>
        <div id="scriptEditor" class="editor-host"></div>
      </div>
      <div id="generatedView" class="view">
        <div class="view-bar"><span>Complete script, ready to run with <code>pwsh</code>. Read-only: edit the designer and Script tab instead.</span><span class="spacer"></span><button class="btn" data-cmd="copyScript">Copy</button><button class="btn primary" data-cmd="export">Export .ps1</button></div>
        <div id="generatedEditor" class="editor-host"></div>
      </div>
      <div id="xamlView" class="view">
        <div class="view-bar"><span>XAML the script loads with <code>[AvaloniaRuntimeXamlLoader]::Parse()</code>.</span><span class="spacer"></span><button class="btn" data-cmd="copyXaml">Copy</button></div>
        <div id="xamlEditor" class="editor-host"></div>
      </div>
      <div id="outputPanel" hidden>
        <div class="out-bar">
          <b>Output</b><span id="outStatus"></span><span class="spacer"></span>
          <button class="btn" id="outStop" disabled>Stop</button>
          <button class="btn" id="outClear">Clear</button>
          <button class="btn" id="outClose" title="Hide the output panel">&#10005;</button>
        </div>
        <div id="outLines"></div>
      </div>
    </section>

    <aside id="right" class="dock">
      <section class="panel" id="propsPanel">
        <div class="panel-title">Properties</div>
        <div class="prop-head">
          <select id="objSelect"></select>
          <div class="prop-tabs">
            <button data-ptab="props" class="on" title="Properties">Properties</button>
            <button data-ptab="events" title="Events">Events</button>
            <span class="spacer"></span>
            <button id="sortBtn" title="Categorized / Alphabetical">A&#8595;Z</button>
          </div>
        </div>
        <div id="props" class="panel-body"></div>
        <div id="propHelp"></div>
      </section>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="stMsg">Ready</span>
    <span class="spacer"></span>
    <button id="stRunner" class="st-btn"></button>
    <button id="stProblems" class="st-btn"></button>
    <span id="stSel"></span>
    <span id="stPos"></span>
  </footer>

  <div id="ctxMenu" class="ctx" hidden></div>
  <div id="modal" class="modal" hidden><div class="modal-box"><div class="modal-title"></div><div class="modal-body"></div><div class="modal-foot"></div></div></div>
  <input id="fileInput" type="file" accept=".json,.ps1,.guiproj" hidden>

  <script src="js/controls.js"></script>
  <script src="js/codegen.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/examples.js"></script>
  <script src="js/snippets.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
