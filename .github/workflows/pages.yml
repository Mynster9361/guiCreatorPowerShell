name: Publish to GitHub Pages

# Publishes the designer to https://guicreator.mynster-it.dk on every push to main.
# The site only contains what the web app needs; the generator checks run first so a
# broken build is never published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Check the code generator before publishing
        run: |
          for f in js/*.js tests/*.mjs tests/tools/*.mjs; do node --check "$f"; done
          node tests/build-test-scripts.mjs "$RUNNER_TEMP/generated"

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js examples snippets Start-GuiCreator.ps1 README.md _site/
          # GitHub Pages with a custom domain: keep the CNAME next to index.html as well
          echo "guicreator.mynster-it.dk" > _site/CNAME
          touch _site/.nojekyll
          # GitHub Pages lets browsers keep files for 10 minutes (max-age=600). Versioned script and
          # stylesheet URLs make each deploy load as one set, instead of a new index.html with old scripts.
          v="${GITHUB_SHA::8}"
          want=$(grep -cE "(src|href)=\"(js|css)/" index.html)
          sed -i -E "s#(src|href)=\"((js|css)/[^\"?]+)\"#\1=\"\2?v=$v\"#g" _site/index.html
          n=$(grep -c "?v=$v\"" _site/index.html)
          echo "versioned $n of $want asset URLs with ?v=$v"
          [ "$n" -gt 0 ] && [ "$n" -eq "$want" ] || { echo "not every js/css URL in index.html was versioned"; exit 1; }
          find _site -type f | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
